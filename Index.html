<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mafia - Multiplayer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS for single-file multiplayer -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        #app-container {
            max-width: 450px;
            margin: 0 auto;
            height: 100vh;
            background-color: #0f172a;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            padding: 24px;
            overflow-y: auto;
        }
        .screen.active {
            display: flex;
        }

        /* --- HOLD TO REVEAL CARD STYLES --- */
        .card-container {
            width: 100%;
            height: 400px;
            position: relative;
            border-radius: 16px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 16px;
            text-align: center;
            padding: 24px;
            transition: opacity 0.2s ease-in-out, transform 0.1s;
        }
        .card-front { background-color: #1e293b; border: 2px solid #334155; opacity: 1; z-index: 2; }
        .card-back { background-color: #7f1d1d; border: 2px solid #ef4444; opacity: 0; z-index: 1; }
        .card-container.revealed .card-front { opacity: 0; z-index: 1; }
        .card-container.revealed .card-back { opacity: 1; z-index: 2; }
        .card-container:active { transform: scale(0.98); }

        /* --- GRID LAYOUT STYLES --- */
        #screen-table { padding: 0; }
        #table-content { padding: 24px; flex-grow: 1; overflow-y: auto; }

        .players-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        
        .player-node {
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            pointer-events: auto;
        }
        
        .player-node.selectable {
            border-color: #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.2);
            cursor: pointer;
        }
        
        .player-node.selected {
            background-color: #7f1d1d !important;
            border-color: #ef4444;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
            transform: scale(1.05);
        }

        .player-node.dead {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(100%);
        }

        /* --- HOLD ACTION BUTTON STYLES --- */
        .hold-action-btn {
            position: relative;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .hold-action-btn:active { transform: scale(0.95); }
        .hold-action-btn::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background-color: rgba(255, 255, 255, 0.2);
            transition: width 0s; /* Fix: Snap back instantly when released */
            z-index: 1;
        }
        .hold-action-btn.holding::after { 
            width: 100%; 
            transition: width 1.5s linear; /* Smoothly fill up when holding */
        }
        .hold-action-btn > * { position: relative; z-index: 2; }
    </style>
</head>
<body>

<div id="app-container">

    <!-- 0. MAIN MENU (Multiplayer Entry) -->
    <div id="screen-menu" class="screen active justify-center">
        <div class="text-center mb-12">
            <h1 class="text-5xl font-black tracking-widest text-red-500 mb-2 drop-shadow-lg">MAFIA</h1>
            <p class="text-slate-400 font-medium tracking-wide">Multiplayer Edition</p>
        </div>

        <div class="space-y-6">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 pl-1">Your Name</label>
                <input type="text" id="player-name-input" placeholder="e.g. Alex" class="w-full bg-slate-900 border-2 border-slate-700 text-white rounded-xl p-4 outline-none focus:border-red-500 transition-colors text-lg font-medium text-center">
            </div>

            <div class="pt-4 border-t border-slate-800 space-y-4">
                <button onclick="hostGame()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 px-6 rounded-xl transition-colors shadow-lg shadow-red-900/50">
                    Host New Game
                </button>
                
                <div class="flex gap-2">
                    <input type="text" id="room-code-input" placeholder="CODE" maxlength="4" class="w-1/3 bg-slate-900 border-2 border-slate-700 text-white rounded-xl p-4 outline-none focus:border-blue-500 transition-colors text-lg font-black text-center uppercase tracking-widest">
                    <button onclick="joinGame()" class="w-2/3 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-xl transition-colors shadow-lg shadow-blue-900/50">
                        Join Game
                    </button>
                </div>
            </div>
            
            <p id="connection-status" class="text-center text-sm font-semibold text-yellow-500 h-4"></p>
        </div>
    </div>

    <!-- 1. LOBBY SCREEN -->
    <div id="screen-lobby" class="screen">
        <div class="text-center mb-8 mt-12">
            <h1 class="text-4xl font-bold tracking-widest text-red-500 mb-2">MAFIA</h1>
            <p class="text-slate-400">Room Code: <span id="display-room-code" class="font-mono text-white font-bold tracking-widest text-lg">----</span></p>
        </div>

        <div class="flex-grow">
            <h3 class="text-sm font-semibold text-slate-400 mb-3 uppercase tracking-wider">Players</h3>
            <ul id="lobby-player-list" class="space-y-2">
                <!-- Populated by JS -->
            </ul>
        </div>

        <div class="mt-auto pt-6" id="host-controls" style="display: none;">
            <div class="mb-4 bg-slate-800 p-4 rounded-xl border border-slate-700">
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Voting Time Limit</label>
                <select id="vote-timer-select" class="w-full bg-slate-900 border border-slate-700 text-white rounded-lg p-2 outline-none">
                    <option value="15">15 Seconds</option>
                    <option value="30" selected>30 Seconds</option>
                    <option value="60">60 Seconds</option>
                </select>
            </div>
            <button onclick="hostStartGame()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 px-6 rounded-xl transition-colors shadow-lg shadow-red-900/50">
                Start Game
            </button>
        </div>
        <div class="mt-auto pt-6" id="client-controls" style="display: none;">
            <p class="text-center text-slate-400 font-medium py-4">Waiting for host to start...</p>
        </div>
    </div>

    <!-- 2. ROLE REVEAL SCREEN -->
    <div id="screen-reveal" class="screen">
        <div class="text-center mb-6 mt-4">
            <h2 class="text-xl font-bold">Secret Role</h2>
            <p class="text-sm text-slate-400 mt-1">Make sure nobody is looking.</p>
        </div>
        <div class="flex-grow flex items-center justify-center">
            <div class="card-container shadow-2xl" id="roleCard">
                <div class="card-face card-front">
                    <svg class="w-16 h-16 text-slate-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                    <h2 class="text-2xl font-bold mb-2">Hold to Reveal</h2>
                </div>
                <div class="card-face card-back" id="role-card-back">
                    <!-- Injected by JS -->
                </div>
            </div>
        </div>
        <div class="mt-auto pt-6">
            <button id="btn-continue-table" onclick="markReady()" class="w-full bg-slate-700 text-slate-400 font-bold py-4 px-6 rounded-xl transition-colors opacity-50 cursor-not-allowed" disabled>
                Look at role to continue
            </button>
        </div>
    </div>

    <!-- 3. MAIN GAME SCREEN (Grid + Bottom Console) -->
    <div id="screen-table" class="screen flex-col">
        <div id="table-content">
            <div class="mb-6 text-center">
                <h2 class="text-xl font-bold text-slate-200 tracking-widest uppercase">Town Members</h2>
            </div>
            <div id="players-grid" class="players-grid pb-12">
                <!-- Nodes injected by JS -->
            </div>
        </div>

        <div id="bottom-console" class="w-full bg-slate-800 border-t-4 border-slate-700 flex flex-col items-center justify-center p-6 text-center z-20 shadow-[0_-10px_20px_rgba(0,0,0,0.3)] transition-colors duration-500 mt-auto">
            <div id="console-content" class="w-full h-full flex flex-col items-center justify-center max-w-sm mx-auto">
                <div id="phase-timer" class="text-4xl font-mono font-black text-white mb-1 drop-shadow-md hidden">--</div>
                <h3 id="console-title" class="text-xl font-bold text-white mb-2">Phase</h3>
                <p id="console-desc" class="text-sm text-slate-300 mb-5">Instructions here</p>
                
                <!-- Action Buttons -->
                <div id="action-btn-hold" class="hold-action-btn bg-blue-600 text-white font-bold py-4 px-4 rounded-xl w-full text-base hidden">
                    <span>Hold Action</span>
                </div>
                
                <button id="action-btn-tap" class="bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-4 px-4 rounded-xl w-full text-base hidden shadow-lg" onclick="executeTapAction()">
                    Cast Vote
                </button>
            </div>
        </div>
    </div>

    <!-- 4. RESULT SCREEN -->
    <div id="screen-result" class="screen">
        <div class="flex-grow flex flex-col items-center justify-center text-center">
            <h1 id="result-title" class="text-5xl font-black mb-4">GAME OVER</h1>
            <p id="result-desc" class="text-xl text-slate-300">The game has ended.</p>
        </div>
        <div class="mt-auto pt-6">
            <button onclick="location.reload()" class="w-full bg-white text-slate-900 hover:bg-slate-200 font-bold py-4 px-6 rounded-xl transition-colors">
                Main Menu
            </button>
        </div>
    </div>

</div>

<script>
    // --- MULTIPLAYER CORE STATE ---
    let myId = null;
    let myName = "";
    let isHost = false;
    
    // PeerJS Variables
    let peer = null;
    let hostConnection = null; // Used if Client
    let clientConnections = []; // Used if Host
    
    // THE SOURCE OF TRUTH (Managed entirely by the Host)
    let gameState = {
        phase: 'menu', // menu, lobby, reveal, night, voting, result
        roomCode: '',
        players: [], // { id, name, role, isAlive, isReady }
        timeRemaining: 0,
        announcement: '', // Used for showing who died
        winData: null // { title, desc, color }
    };

    // LOCAL UI STATE
    let selectedTargetId = null;
    let holdTimeout = null;
    let actionLocked = false;
    let votingTimeLimit = 30;

    // --- UTILITIES ---
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => {
            s.classList.remove('active', 'flex');
            s.style.display = ''; 
        });
        document.getElementById(screenId).classList.add('active');
    }

    function setStatus(msg) {
        document.getElementById('connection-status').innerText = msg;
    }

    // ==========================================
    // HOST LOGIC (The Server)
    // ==========================================
    
    function hostGame() {
        myName = document.getElementById('player-name-input').value.trim() || 'Host';
        const code = Math.random().toString(36).substring(2, 6).toUpperCase();
        
        setStatus('Creating room...');
        peer = new Peer('mafia-' + code); // Force a specific ID for easy joining
        
        peer.on('open', (id) => {
            isHost = true;
            myId = 'host';
            gameState.roomCode = code;
            gameState.phase = 'lobby';
            gameState.players.push({ id: myId, name: myName, role: null, isAlive: true, isReady: false });
            
            document.getElementById('host-controls').style.display = 'block';
            broadcastState();
        });

        peer.on('connection', (conn) => {
            clientConnections.push(conn);
            
            conn.on('data', (data) => {
                handleClientAction(conn.peer, data);
            });
            
            conn.on('close', () => {
                // Handle disconnect
                clientConnections = clientConnections.filter(c => c.peer !== conn.peer);
                const player = gameState.players.find(p => p.id === conn.peer);
                if (player) {
                    player.isAlive = false; // Kill them if they drop
                    if (!hostCheckWin()) broadcastState(); // Check if their drop ended the game
                } else {
                    broadcastState();
                }
            });
        });

        peer.on('error', (err) => {
            setStatus('Error: ' + err.type);
        });
    }

    function broadcastState() {
        if (!isHost) return;
        // Host renders their own UI immediately
        renderUI(gameState); 
        // Send state to everyone else
        clientConnections.forEach(conn => {
            conn.send({ type: 'STATE_UPDATE', state: gameState });
        });
    }

    let hostTimerInterval = null;
    function hostStartTimer(seconds, callback) {
        clearInterval(hostTimerInterval);
        gameState.timeRemaining = seconds;
        broadcastState();

        hostTimerInterval = setInterval(() => {
            gameState.timeRemaining--;
            broadcastState(); // Sync timer every second
            
            if (gameState.timeRemaining <= 0) {
                clearInterval(hostTimerInterval);
                callback();
            }
        }, 1000);
    }

    // Host receiving actions from clients
    let nightActions = {}; // { mafiaId: targetId }
    let voteActions = {};  // { voterId: targetId }

    function handleClientAction(peerId, actionData) {
        if (!isHost) return;

        if (actionData.type === 'JOIN') {
            gameState.players.push({ 
                id: peerId, 
                name: actionData.name, 
                role: null, 
                isAlive: gameState.phase === 'lobby', // Fix: Prevents late-joiners from being alive
                isReady: false 
            });
            broadcastState();
        } 
        else if (actionData.type === 'READY') {
            const p = gameState.players.find(p => p.id === (peerId || 'host'));
            if (p) p.isReady = true;
            
            // If everyone is ready, transition to Table
            if (gameState.phase === 'reveal' && gameState.players.every(p => p.isReady)) {
                gameState.phase = 'night';
                gameState.announcement = '';
                broadcastState();
                hostStartTimer(15, hostProcessNight);
            } else {
                broadcastState();
            }
        }
        else if (actionData.type === 'NIGHT_KILL') {
            nightActions[peerId || 'host'] = actionData.targetId;
        }
        else if (actionData.type === 'VOTE') {
            voteActions[peerId || 'host'] = actionData.targetId;
        }
    }

    function hostStartGame() {
        votingTimeLimit = parseInt(document.getElementById('vote-timer-select').value) || 30;
        
        // Assign Roles
        const roles = Array(gameState.players.length).fill('villager');
        roles[0] = 'mafia'; // Guarantee 1 Mafia
        roles.sort(() => Math.random() - 0.5);
        
        gameState.players.forEach((p, i) => {
            p.role = roles[i];
            p.isReady = false;
        });
        
        gameState.phase = 'reveal';
        broadcastState();
    }

    function hostProcessNight() {
        let killedId = null;
        
        // Find what the Mafia did
        const mafiaPlayer = gameState.players.find(p => p.role === 'mafia');
        if (mafiaPlayer && mafiaPlayer.isAlive) {
            killedId = nightActions[mafiaPlayer.id];
        }
        
        // Clear actions for next round
        nightActions = {}; 
        
        if (killedId) {
            // FIX: Ensure ID comparison matches string types properly
            const victim = gameState.players.find(p => String(p.id) === String(killedId));
            if (victim) {
                victim.isAlive = false;
                gameState.announcement = `${victim.name} was eliminated in the night.`;
            }
        } else {
            gameState.announcement = "Nobody was eliminated last night.";
        }
        
        if (hostCheckWin()) return;
        
        gameState.phase = 'voting';
        broadcastState();
        hostStartTimer(votingTimeLimit, hostProcessVoting);
    }

    function hostProcessVoting() {
        let voteCounts = {};
        gameState.players.forEach(p => { if (p.isAlive) voteCounts[p.id] = 0; });
        
        // Tally ONLY the votes that were actually cast
        for (const targetId of Object.values(voteActions)) {
            if (voteCounts[targetId] !== undefined) voteCounts[targetId]++;
        }
        voteActions = {}; // Clear
        
        let maxVotes = 0;
        let executedId = null;
        let isTie = false;

        for (const [id, count] of Object.entries(voteCounts)) {
            if (count > maxVotes) {
                maxVotes = count;
                executedId = id; // FIX: Removed parseInt() which corrupted alphanumeric PeerJS IDs
                isTie = false;
            } else if (count === maxVotes && count > 0) {
                isTie = true; // Tie at the highest vote count
            }
        }
        
        if (executedId && !isTie) {
            const victim = gameState.players.find(p => String(p.id) === String(executedId));
            if(victim) {
                victim.isAlive = false;
                const displayRole = victim.role.charAt(0).toUpperCase() + victim.role.slice(1);
                gameState.announcement = `${victim.name} (The ${displayRole}) received ${maxVotes} votes and was executed.`;
            }
        } else {
            gameState.announcement = 'Votes were tied or skipped. Nobody was executed.';
        }
        
        if (hostCheckWin()) return;
        
        // Loop back to Night immediately
        gameState.phase = 'night';
        broadcastState();
        hostStartTimer(15, hostProcessNight);
    }

    function hostCheckWin() {
        const alivePlayers = gameState.players.filter(p => p.isAlive);
        const aliveMafia = alivePlayers.filter(p => p.role === 'mafia').length;
        const aliveVillagers = alivePlayers.filter(p => p.role === 'villager').length;
        
        const prefix = gameState.announcement ? gameState.announcement + "\n\n" : "";
        
        if (aliveMafia === 0) {
            const mafiaPlayer = gameState.players.find(p => p.role === 'mafia');
            const mafiaName = mafiaPlayer ? mafiaPlayer.name : "Someone";
            gameState.phase = 'result';
            gameState.winData = { title: "VILLAGERS WIN", desc: `${prefix}'${mafiaName}' was the mafia!`, color: "text-blue-500" };
            clearInterval(hostTimerInterval); // Fix: Stop the background clock!
            broadcastState();
            return true;
        } else if (aliveMafia >= aliveVillagers) {
            gameState.phase = 'result';
            gameState.winData = { title: "MAFIA WINS", desc: `${prefix}The Mafia overran the town.`, color: "text-red-500" };
            clearInterval(hostTimerInterval); // Fix: Stop the background clock!
            broadcastState();
            return true;
        }
        return false;
    }

    // ==========================================
    // CLIENT LOGIC (The Player)
    // ==========================================

    function joinGame() {
        myName = document.getElementById('player-name-input').value.trim() || 'Player';
        const code = document.getElementById('room-code-input').value.trim().toUpperCase();
        
        if (!code) return setStatus('Enter a Room Code');
        
        setStatus('Connecting to ' + code + '...');
        peer = new Peer(); // Generate random ID for client
        
        peer.on('open', (id) => {
            myId = id;
            hostConnection = peer.connect('mafia-' + code);
            
            hostConnection.on('open', () => {
                setStatus('Connected!');
                document.getElementById('client-controls').style.display = 'block';
                hostConnection.send({ type: 'JOIN', name: myName });
            });

            hostConnection.on('data', (data) => {
                if (data.type === 'STATE_UPDATE') {
                    renderUI(data.state);
                }
            });

            hostConnection.on('close', () => {
                alert("Connection to host lost!");
                location.reload();
            });
        });
        
        peer.on('error', (err) => {
            setStatus('Error: Could not find room.');
        });
    }

    function sendToServer(actionType, targetId = null) {
        actionLocked = true; // Lock local UI
        
        if (isHost) {
            handleClientAction(myId, { type: actionType, targetId: targetId });
        } else if (hostConnection) {
            hostConnection.send({ type: actionType, targetId: targetId });
        }
    }

    // ==========================================
    // UNIFIED UI RENDERER (Driven by State)
    // ==========================================

    let lastPhase = null;

    function renderUI(newState) {
        gameState = newState;
        const myPlayer = gameState.players.find(p => p.id === myId);
        if (!myPlayer) return; // Haven't synced yet

        // 1. PHASE TRANSITIONS
        if (gameState.phase !== lastPhase) {
            actionLocked = false; // Unlock actions on new phase
            selectedTargetId = null;
            
            if (gameState.phase === 'lobby') {
                showScreen('screen-lobby');
                document.getElementById('display-room-code').innerText = gameState.roomCode;
            } 
            else if (gameState.phase === 'reveal') {
                showScreen('screen-reveal');
                const cardBack = document.getElementById('role-card-back');
                if (myPlayer.role === 'mafia') {
                    cardBack.innerHTML = `<h1 class="text-4xl font-black tracking-widest mb-2 text-white">MAFIA</h1><p class="text-red-200 font-medium">Goal: Eliminate the town.</p>`;
                    cardBack.style.backgroundColor = '#7f1d1d';
                } else {
                    cardBack.innerHTML = `<h1 class="text-4xl font-black tracking-widest mb-2 text-white">VILLAGER</h1><p class="text-blue-200 font-medium">Goal: Find the Mafia.</p>`;
                    cardBack.style.backgroundColor = '#1e3a8a';
                    cardBack.style.borderColor = '#3b82f6';
                }
                
                // Reset reveal button state
                const btn = document.getElementById('btn-continue-table');
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed', 'bg-slate-700', 'text-slate-400');
                btn.classList.remove('bg-white', 'text-slate-900', 'hover:bg-slate-200');
                btn.innerText = "Look at role to continue";
            }
            else if (gameState.phase === 'night' || gameState.phase === 'voting') {
                showScreen('screen-table');
                setupTableNodes(myPlayer);
            }
            else if (gameState.phase === 'result') {
                showScreen('screen-result');
                document.getElementById('result-title').innerText = gameState.winData.title;
                document.getElementById('result-title').className = `text-5xl font-black mb-4 ${gameState.winData.color}`;
                document.getElementById('result-desc').innerText = gameState.winData.desc;
            }
            
            lastPhase = gameState.phase;
        }

        // 2. CONTINUOUS UPDATES (Lobby List, Timers, Dead states)
        if (gameState.phase === 'lobby') {
            const list = document.getElementById('lobby-player-list');
            list.innerHTML = gameState.players.map(p => `
                <li class="bg-slate-800 px-4 py-3 rounded-lg flex items-center justify-between border border-slate-700 shadow-sm">
                    <span class="font-medium ${p.id === myId ? 'text-white font-bold' : 'text-slate-300'}">${p.name}</span>
                    ${p.id === 'host' ? '<span class="text-xs bg-slate-700 px-2 py-1 rounded text-slate-300">Host</span>' : '<span class="w-2 h-2 rounded-full bg-green-500"></span>'}
                </li>
            `).join('');
        }
        else if (gameState.phase === 'night' || gameState.phase === 'voting') {
            // Timer
            const timerEl = document.getElementById('phase-timer');
            timerEl.innerText = gameState.timeRemaining;
            timerEl.classList.remove('hidden');

            // Console UI
            updateCenterConsole(myPlayer);
            
            // Sync Dead Players
            gameState.players.forEach(p => {
                const node = document.getElementById(`node-${p.id}`);
                if (node && !p.isAlive) node.classList.add('dead');
            });
        }
    }

    function updateCenterConsole(myPlayer) {
        const titleEl = document.getElementById('console-title');
        const descEl = document.getElementById('console-desc');
        const actionHold = document.getElementById('action-btn-hold');
        const actionTap = document.getElementById('action-btn-tap');
        
        actionHold.classList.add('hidden');
        actionTap.classList.add('hidden');
        actionHold.classList.remove('holding', 'bg-blue-600', 'bg-red-600', 'bg-slate-600');
        
        let descPrefix = gameState.announcement ? gameState.announcement + " " : "";

        if (!myPlayer.isAlive) {
            titleEl.innerText = "SPECTATING";
            titleEl.style.color = '#6b7280';
            descEl.innerText = descPrefix + "You are dead. Wait for the game to end.";
            return;
        }

        if (actionLocked) {
            titleEl.innerText = "WAITING";
            titleEl.style.color = '#9ca3af';
            descEl.innerText = "Action confirmed. Waiting for timer...";
            return;
        }

        if (gameState.phase === 'night') {
            document.getElementById('bottom-console').style.borderColor = '#1e1b4b'; // Dark
            titleEl.innerText = "NIGHT PHASE";
            
            if (myPlayer.role === 'mafia') {
                titleEl.style.color = '#60a5fa';
                descEl.innerText = descPrefix + "Tap a player to target them.";
                
                actionHold.classList.remove('hidden');
                if (selectedTargetId) {
                    actionHold.classList.add('bg-red-600');
                    actionHold.classList.remove('opacity-50', 'pointer-events-none');
                    actionHold.querySelector('span').innerText = 'Hold to Kill';
                } else {
                    actionHold.classList.add('bg-slate-600', 'opacity-50', 'pointer-events-none');
                    actionHold.querySelector('span').innerText = 'Select a Target';
                }
            } else {
                titleEl.style.color = '#60a5fa';
                descEl.innerText = descPrefix + "It is dangerous outside.";
                
                actionHold.classList.remove('hidden', 'opacity-50', 'pointer-events-none');
                actionHold.classList.add('bg-blue-600');
                actionHold.querySelector('span').innerText = 'Hold to Sleep';
            }
        } 
        else if (gameState.phase === 'voting') {
            document.getElementById('bottom-console').style.borderColor = '#b45309'; // Warning Orange
            titleEl.innerText = "EMERGENCY MEETING";
            titleEl.style.color = '#ef4444';
            descEl.innerText = descPrefix + "Cast your vote.";
            
            actionTap.classList.remove('hidden');
            if (selectedTargetId) {
                actionTap.classList.remove('opacity-50', 'pointer-events-none');
                actionTap.innerText = 'Cast Vote';
            } else {
                actionTap.classList.add('opacity-50', 'pointer-events-none');
                actionTap.innerText = 'Select someone to vote';
            }
        }
    }

    function setupTableNodes(myPlayer) {
        const container = document.getElementById('players-grid');
        container.innerHTML = '';
        
        gameState.players.forEach((p) => {
            const node = document.createElement('div');
            node.id = `node-${p.id}`;
            node.className = `player-node shadow-lg ${!p.isAlive ? 'dead' : ''}`;
            
            // Is selectable logic
            if (p.isAlive && myPlayer.isAlive && !actionLocked) {
                if (gameState.phase === 'night' && myPlayer.role === 'mafia' && p.id !== myId) {
                    node.classList.add('selectable');
                } else if (gameState.phase === 'voting' && p.id !== myId) {
                    node.classList.add('selectable');
                }
            }
            
            node.innerHTML = `
                <div class="player-avatar w-14 h-14 bg-slate-700 rounded-full flex items-center justify-center border-2 border-slate-600 text-xl font-bold mb-3 shadow-inner text-white">
                    ${p.name.charAt(0).toUpperCase()}
                </div>
                <div class="text-center text-sm font-bold ${p.id === myId ? 'text-blue-400' : 'text-slate-300'}">
                    ${p.name}
                </div>
            `;
            
            node.addEventListener('click', () => {
                if (node.classList.contains('selectable')) {
                    selectedTargetId = p.id;
                    document.querySelectorAll('.player-node').forEach(n => n.classList.remove('selected'));
                    node.classList.add('selected');
                    updateCenterConsole(myPlayer); // Refresh UI
                }
            });
            
            container.appendChild(node);
        });
    }

    // --- LOCAL REVEAL CARD LOGIC ---
    const card = document.getElementById('roleCard');
    function revealCard(e) {
        if(e.cancelable) e.preventDefault();
        card.classList.add('revealed');
        if (navigator.vibrate) navigator.vibrate(50);
        
        const btn = document.getElementById('btn-continue-table');
        btn.disabled = false;
        btn.classList.remove('opacity-50', 'cursor-not-allowed', 'bg-slate-700', 'text-slate-400');
        btn.classList.add('bg-white', 'text-slate-900', 'hover:bg-slate-200');
        btn.innerText = "I am ready";
    }
    function hideCard(e) {
        if(e.cancelable) e.preventDefault();
        card.classList.remove('revealed');
    }
    card.addEventListener('touchstart', revealCard, { passive: false });
    card.addEventListener('touchend', hideCard);
    card.addEventListener('touchcancel', hideCard);
    card.addEventListener('mousedown', revealCard);
    card.addEventListener('mouseup', hideCard);
    card.addEventListener('mouseleave', hideCard);
    card.addEventListener('contextmenu', e => e.preventDefault());

    function markReady() {
        const btn = document.getElementById('btn-continue-table');
        btn.innerText = "Waiting for others...";
        btn.disabled = true;
        btn.classList.add('opacity-50', 'cursor-not-allowed');
        sendToServer('READY');
    }

    // --- LOCAL ACTION BUTTON LOGIC ---
    const actionHoldBtn = document.getElementById('action-btn-hold');
    
    function startHold(e) {
        if(e && e.cancelable) e.preventDefault();
        if (actionHoldBtn.classList.contains('pointer-events-none') || actionLocked) return;
        
        // FIX: Clear any lingering timeouts to prevent double-firing
        clearTimeout(holdTimeout);
        
        actionHoldBtn.classList.add('holding');
        try { if (navigator.vibrate) navigator.vibrate(50); } catch(err) {}
        
        holdTimeout = setTimeout(() => {
            try { if (navigator.vibrate) navigator.vibrate([100, 50, 100]); } catch(err) {}
            actionHoldBtn.classList.remove('holding');
            sendToServer('NIGHT_KILL', selectedTargetId);
            updateCenterConsole(gameState.players.find(p=>p.id===myId)); // Force update to 'WAITING'
        }, 1500); 
    }
    
    function cancelHold(e) {
        if(e && e.cancelable) e.preventDefault();
        actionHoldBtn.classList.remove('holding');
        clearTimeout(holdTimeout);
    }
    
    actionHoldBtn.addEventListener('touchstart', startHold, { passive: false });
    actionHoldBtn.addEventListener('touchend', cancelHold);
    actionHoldBtn.addEventListener('touchcancel', cancelHold);
    
    // FIX: Add touchmove failsafe. If the thumb slides off the button, cancel the hold.
    actionHoldBtn.addEventListener('touchmove', (e) => {
        const touch = e.touches[0];
        const rect = actionHoldBtn.getBoundingClientRect();
        if (touch.clientX < rect.left - 20 || touch.clientX > rect.right + 20 ||
            touch.clientY < rect.top - 20 || touch.clientY > rect.bottom + 20) {
            cancelHold();
        }
    }, { passive: true });

    actionHoldBtn.addEventListener('mousedown', startHold);
    actionHoldBtn.addEventListener('mouseup', cancelHold);
    actionHoldBtn.addEventListener('mouseleave', cancelHold);
    actionHoldBtn.addEventListener('contextmenu', e => e.preventDefault());

    function executeTapAction() {
        if (actionLocked) return;
        try { if (navigator.vibrate) navigator.vibrate([100, 50, 100]); } catch(err) {}
        sendToServer('VOTE', selectedTargetId);
        updateCenterConsole(gameState.players.find(p=>p.id===myId));
    }

</script>
</body>
</html>
